# Netlify build settings (Netlify reads this file automatically).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node.js 22.12 or newer.
  NODE_VERSION = "22"

# Long-term caching for hashed files (fonts, CSS, JS, images).
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
